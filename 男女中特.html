    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error(" ");
            });
    }

    function getPredictDanShuangForKy(kyNum) {
        let actualKy = ((kyNum - 1) % 366) + 1;
        if (STATIC_PREDICTIONS[actualKy]) {
            return STATIC_PREDICTIONS[actualKy];
        }
        let cycle = Math.floor((actualKy - 1) / 2);
        return cycle % 2 === 0 ? "男男男" : "女女女";
    }

    function getDanShuangByNum(animal) {
        if (NAN_SHOU.includes(animal)) return "男男男";
        if (NV_SHOU.includes(animal)) return "女女女";
        return "";
    }

    function formatTwoDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    async function initPredict() {
        try {
            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animal = (r.c[1] && r.c[1].v !== null && r.c[1].v !== undefined) ? String(r.c[1].v).trim() : '';
                        if (formattedNum && animal) {
                            duLieuMap[formattedNum] = animal;
                        }
                    }
                });
            }

            const rawKQ = await fetchJSONP(URL_KQ);
            const rows = rawKQ.table.rows;
            let parsedList = [];

            if (rows) {
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i].c;
                    if (!r || !r[0] || r[0].v === null || r[0].v === undefined) continue;
                    
                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numTeFormatted = '';
                    if (r[7] && r[7].v !== null && r[7].v !== undefined && String(r[7].v).trim() !== '' && String(r[7].v).trim() !== '00') {
                        numTeFormatted = formatTwoDigits(r[7].v);
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            kyNum: kyOnlyNum,
                            numTe: numTeFormatted
                        });
                    }
                }
            }

            let doneList = [];
            let pendingKyObj = null;

            for (let i = 0; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.numTe !== '' && item.numTe !== '00';
                if (isDone) {
                    doneList.push(item);
                } else {
                    pendingKyObj = item;
                }
            }

            let targetPredictKy = 1;
            if (pendingKyObj) {
                targetPredictKy = pendingKyObj.kyNum;
            } else if (doneList.length > 0) {
                targetPredictKy = doneList[doneList.length - 1].kyNum + 1;
            }

            let evaluatedDoneList = [];
            for (let i = 0; i < doneList.length; i++) {
                let item = doneList[i];
                let predicted = getPredictDanShuangForKy(item.kyNum);
                let animal = duLieuMap[item.numTe] || '';
                let actual = getDanShuangByNum(animal);
                let isValidAnimal = (NAN_SHOU.includes(animal) || NV_SHOU.includes(animal));
                let isWin = isValidAnimal && actual && (predicted === actual);
                evaluatedDoneList.push({ item, isWin });
            }

            let checkLatestMisses = 0;
            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (!evaluatedDoneList[i].isWin) {
                    checkLatestMisses++;
                } else {
                    break;
                }
            }

            let cutoffIndex = evaluatedDoneList.length;
            if (checkLatestMisses < 3) {
                let consecutiveMisses = 0;
                for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                    if (!evaluatedDoneList[i].isWin) {
                        consecutiveMisses++;
                        if (consecutiveMisses >= 3) {
                            cutoffIndex = i + 1;
                            break;
                        }
                    } else {
                        consecutiveMisses = 0;
                    }
                }
            }

            let nextKyNum = targetPredictKy;
            let predictNext = getPredictDanShuangForKy(nextKyNum);
            let kyStrNext = String(nextKyNum).padStart(3, '0');

            let htmlNextKy = `<li>\n\t<span style="font-size:18px;">${kyStrNext}期：<span style="color:#0000FF;">男肖女肖</span>【<span style="color:#ff0000;">${predictNext}</span>】开：<span style="color:#FF0000;">？00</span><span style="color:#0000FF;">准</span></span>\n</li>`;

            let historyOutputs = [];
            if (checkLatestMisses < 3) {
                for (let i = cutoffIndex; i < doneList.length; i++) {
                    let item = doneList[i];
                    let predicted = getPredictDanShuangForKy(item.kyNum);
                    let shengXiaoWin = duLieuMap[item.numTe] || '';
                    let actual = getDanShuangByNum(shengXiaoWin);
                    let isValidAnimal = (NAN_SHOU.includes(shengXiaoWin) || NV_SHOU.includes(shengXiaoWin));
                    let isWin = isValidAnimal && actual && (predicted === actual);

                    if (isWin) {
                        let resStrWin = shengXiaoWin + item.numTe;
                        let kyStr = String(item.kyNum).padStart(3, '0');
                        let formattedPredictHtml = `<span style="color:#ff0000;background-color:yellow;">${predicted}</span>`;
                        historyOutputs.push(`<li>\n\t<span style="font-size:18px;">${kyStr}期：<span style="color:#0000FF;">男肖女肖</span>【${formattedPredictHtml}】开：<span style="color:#FF0000;">${resStrWin}</span><span style="color:#0000FF;">准</span></span>\n</li>`);
                    }
                }
            }
            historyOutputs.reverse();

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = String(nextKyNum + 1).padStart(3, '0');
                let kyStr2 = String(nextKyNum + 2).padStart(3, '0');
                let defaultHtml1 = `<li>\n\t<span style="font-size:18px;">${kyStr1}期：<span style="color:#0000FF;">男肖女肖</span>【<span style="color:#ff0000;">發發發</span>】开：<span style="color:#FF0000;">？00</span><span style="color:#0000FF;">准</span></span>\n</li>`;
                let defaultHtml2 = `<li>\n\t<span style="font-size:18px;">${kyStr2}期：<span style="color:#0000FF;">男肖女肖</span>【<span style="color:#ff0000;">發發發</span>】开：<span style="color:#FF0000;">？00</span><span style="color:#0000FF;">准</span></span>\n</li>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = String(nextKyNum + 1).padStart(3, '0');
                let defaultHtmlExtra = `<li>\n\t<span style="font-size:18px;">${kyStrExtra}期：<span style="color:#0000FF;">男肖女肖</span>【<span style="color:#ff0000;">發發發</span>】开：<span style="color:#FF0000;">？00</span><span style="color:#0000FF;">准</span></span>\n</li>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
