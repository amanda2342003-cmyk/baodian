    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error(" ");
            });
    }

    function getPredictFiveAnimalsForKy(kyNum) {
        let actualKy = ((kyNum - 1) % 366) + 1;
        if (STATIC_PREDICTIONS[actualKy]) {
            return STATIC_PREDICTIONS[actualKy];
        }
        return "鼠牛虎兔龙";
    }

    function formatTwoDigits(val) {
        let cleanVal = String(val).trim();
        let num = parseInt(cleanVal.replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    function formatThreeDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '001';
        return String(num).padStart(3, '0');
    }

                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animal = (r.c[1] && r.c[1].v !== null && r.c[1].v !== undefined) ? String(r.c[1].v).trim() : '';

                        }
                    }

                let predictedFive = getPredictFiveAnimalsForKy(item.kyNum);
                let actualAnimal = duLieuMap[item.numTe] || '';
                let isWin = actualAnimal !== '' && predictedFive.includes(actualAnimal);
                evaluatedDoneList.push({ item, predictedFive, actualAnimal, isWin });
            }

            let checkLatestMisses = 0;
            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (!evaluatedDoneList[i].isWin) {
                    checkLatestMisses++;
                } else {
                    break;
                }
            }

            let cutoffIndex = 0;
            if (checkLatestMisses < 3) {
                let consecutiveMisses = 0;
                for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                    if (!evaluatedDoneList[i].isWin) {
                        consecutiveMisses++;
                        if (consecutiveMisses >= 3) {
                            cutoffIndex = i + 1;
                            break;
                        }
                    } else {
                        consecutiveMisses = 0;
                    }
                }
            } else {
                cutoffIndex = evaluatedDoneList.length;
            }

            let nextKyNum = targetPredictKy;
            let predictNext = getPredictFiveAnimalsForKy(nextKyNum);
            let kyStrNext = formatThreeDigits(nextKyNum);

            let htmlNextKy = `<h6><span style="font-size:small;">${kyStrNext}期：<span style="color:#0000FF;">五肖中特</span>【${predictNext}】开：<span style="color:#FF0000;">？00</span><span style="color:#0000FF;">准</span></span> </h6>`;

            let historyOutputs = [];

            if (checkLatestMisses < 3) {
                for (let i = cutoffIndex; i < evaluatedDoneList.length; i++) {
                    let entry = evaluatedDoneList[i];
                    if (entry.isWin) {
                        let resStrWin = entry.actualAnimal + entry.item.numTe;
                        let kyStr = formatThreeDigits(entry.item.kyNum);
                        
                        let fiveChars = entry.predictedFive.split('');
                        let formattedPredictHtml = fiveChars.map(char => {
                            if (char === entry.actualAnimal) {
                                return `<span style="color:#ff0000; background-color:yellow; font-weight:bold;">${char}</span>`;
                            }
                            return char;
                        }).join('');
                        
                        historyOutputs.push(`<h6><span style="font-size:small;">${kyStr}期：<span style="color:#0000FF;">五肖中特</span>【${formattedPredictHtml}】开：<span style="color:#FF0000;">${resStrWin}</span><span style="color:#0000FF;">准</span></span> </h6>`);
                    }
                }
            }

            historyOutputs.reverse();

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = formatThreeDigits(nextKyNum + 1);
                let kyStr2 = formatThreeDigits(nextKyNum + 2);
                let defaultHtml1 = `<h6><span style="font-size:small;">${kyStr1}期：<span style="color:#0000FF;">五肖中特</span>【發發發發發】开：<span style="color:#FF0000;">？00</span><span style="color:#0000FF;">准</span></span> </h6>`;
                let defaultHtml2 = `<h6><span style="font-size:small;">${kyStr2}期：<span style="color:#0000FF;">五肖中特</span>【發發發發發】开：<span style="color:#FF0000;">？00</span><span style="color:#0000FF;">准</span></span> </h6>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = formatThreeDigits(nextKyNum + 1);
                let defaultHtmlExtra = `<h6><span style="font-size:small;">${kyStrExtra}期：<span style="color:#0000FF;">五肖中特</span>【發發發發發】开：<span style="color:#FF0000;">？00</span><span style="color:#0000FF;">准</span></span> </h6>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
    }
    initPredict();
</script>
