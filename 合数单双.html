    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error(" ");
            });
    }

    function getPredictDanShuangForKy(kyNum) {
        if (STATIC_PREDICTIONS[kyNum]) {
            return STATIC_PREDICTIONS[kyNum];
        }
        let cycle = Math.floor((kyNum - 1) / 2);
        return cycle % 2 === 0 ? "合数单" : "合数双";
    }

    function getDanShuangByNum(numStr) {
        if (HE_DAN.includes(numStr)) return "合数单";
        if (HE_SHUANG.includes(numStr)) return "合数双";
        return "";
    }

    function formatTwoDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    async function initPredict() {
        try {
            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animal = (r.c[1] && r.c[1].v !== null && r.c[1].v !== undefined) ? String(r.c[1].v).trim() : '';
                        if (formattedNum && animal) {
                            duLieuMap[formattedNum] = animal;
                        }
                    }
                });
            }

            const rawKQ = await fetchJSONP(URL_KQ);
            const rows = rawKQ.table.rows;
            let parsedList = [];
            let maxKyNum = 0;

            if (rows) {
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i].c;
                    if (!r || !r[0] || r[0].v === null || r[0].v === undefined) continue;
                    
                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numTeFormatted = '';
                    if (r[7] && r[7].v !== null && r[7].v !== undefined && String(r[7].v).trim() !== '' && String(r[7].v).trim() !== '00') {
                        numTeFormatted = formatTwoDigits(r[7].v);
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            kyNum: kyOnlyNum,
                            numTe: numTeFormatted
                        });
                        if (kyOnlyNum > maxKyNum) {
                            maxKyNum = kyOnlyNum;
                        }
                    }
                }
            }

            let doneList = [];
            let limitRange = Math.min(parsedList.length, 365);
            let startIndex = parsedList.length - limitRange;

            for (let i = startIndex; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.numTe !== '' && item.numTe !== '00';
                if (isDone) {
                    doneList.push(item);
                }
            }

            let evaluatedDoneList = [];
            for (let i = 0; i < doneList.length; i++) {
                let item = doneList[i];
                let predicted = getPredictDanShuangForKy(item.kyNum);
                let actual = getDanShuangByNum(item.numTe);
                let isValidNum = (HE_DAN.includes(item.numTe) || HE_SHUANG.includes(item.numTe));
                let isWin = isValidNum && actual && (predicted === actual);
                evaluatedDoneList.push({ item, isWin });
            }

            let checkLatestMisses = 0;
            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (!evaluatedDoneList[i].isWin) {
                    checkLatestMisses++;
                } else {
                    break;
                }
            }

            let cutoffIndex = evaluatedDoneList.length;
            if (checkLatestMisses < 3) {
                let consecutiveMisses = 0;
                for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                    if (!evaluatedDoneList[i].isWin) {
                        consecutiveMisses++;
                        if (consecutiveMisses >= 3) {
                            cutoffIndex = i + 1;
                            break;
                        }
                    } else {
                        consecutiveMisses = 0;
                    }
                }
            }

            let nextKyNum = maxKyNum + 1;
            let predictNext = getPredictDanShuangForKy(nextKyNum);
            let kyStrNext = String(nextKyNum).padStart(3, '0');

            let htmlNextKy = `<h6 style="font-size:small;font-weight:normal;">\n\t<b>${kyStrNext}期:<span style="color:#0000FF;">特码合数</span></b>【<span style="color:#FF00FF;font-weight:bold;">${predictNext}</span><b>】开:<span style="color:#FF0000;">？00</span><span style="color:#0000FF;">准</span></b>\n</h6>`;

            let historyOutputs = [];
            if (checkLatestMisses < 3) {
                for (let i = cutoffIndex; i < doneList.length; i++) {
                    let item = doneList[i];
                    let predicted = getPredictDanShuangForKy(item.kyNum);
                    let shengXiaoWin = duLieuMap[item.numTe] || '';
                    let actual = getDanShuangByNum(item.numTe);
                    let isValidNum = (HE_DAN.includes(item.numTe) || HE_SHUANG.includes(item.numTe));
                    let isWin = isValidNum && actual && (predicted === actual);

                    if (isWin) {
                        let resStrWin = shengXiaoWin + item.numTe;
                        let kyStr = String(item.kyNum).padStart(3, '0');
                        let formattedPredictHtml = `<span style="color:#FF00FF;font-weight:bold;background-color:yellow;">${predicted}</span>`;
                        historyOutputs.push(`<h6 style="font-size:small;font-weight:normal;">\n\t<b>${kyStr}期:<span style="color:#0000FF;">特码合数</span></b>【${formattedPredictHtml}<b>】开:<span style="color:#FF0000;">${resStrWin}</span><span style="color:#0000FF;">准</span></b>\n</h6>`);
                    }
                }
            }
            historyOutputs.reverse();

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = String(nextKyNum + 1).padStart(3, '0');
                let kyStr2 = String(nextKyNum + 2).padStart(3, '0');
                let defaultHtml1 = `<h6 style="font-size:small;font-weight:normal;">\n\t<b>${kyStr1}期:<span style="color:#0000FF;">特码合数</span></b>【<span style="color:#FF00FF;font-weight:bold;"><span style="color:#FF00FF;">發發發</span></span>}<b>】开:<span style="color:#FF0000;">？00</span><span style="color:#0000FF;">准</span></b>\n</h6>`.replace('}】', '】');
                let defaultHtml2 = `<h6 style="font-size:small;font-weight:normal;">\n\t<b>${kyStr2}期:<span style="color:#0000FF;">特码合数</span></b>【<span style="color:#FF00FF;font-weight:bold;"><span style="color:#FF00FF;">發發發</span></span>}<b>】开:<span style="color:#FF0000;">？00</span><span style="color:#0000FF;">准</span></b>\n</h6>`.replace('}】', '】');
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = String(nextKyNum + 1).padStart(3, '0');
                let defaultHtmlExtra = `<h6 style="font-size:small;font-weight:normal;">\n\t<b>${kyStrExtra}期:<span style="color:#0000FF;">特码合数</span></b>【<span style="color:#FF00FF;font-weight:bold;"><span style="color:#FF00FF;">發發發</span></span>}<b>】开:<span style="color:#FF0000;">？00</span><span style="color:#0000FF;">准</span></b>\n</h6>`.replace('}】', '】');
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
